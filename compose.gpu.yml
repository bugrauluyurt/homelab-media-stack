# Hardware transcoding on Intel or AMD graphics (x86). Turn it on in .env:
#   COMPOSE_FILE=docker-compose.yml:compose.gpu.yml
#   HWACCEL=vaapi    (Intel or AMD; qsv also works on Intel)
# then run scripts/configure-jellyfin-plugins.py. The linuxserver images join /dev/dri's group themselves.

services:
  jellyfin:
    devices: ["/dev/dri:/dev/dri"]

  plex:
    devices: ["/dev/dri:/dev/dri"]
