[BitTorrent]
# Bind to the VPN tunnel, never the Docker bridge. gluetun routes traffic
# sourced from the bridge IP back out eth0, where the firewall drops it;
# scripts/sync-port reconciles the address whenever the tunnel changes.
Session\Interface=tun0
Session\InterfaceName=tun0
Session\DefaultSavePath=/data/torrents
# New torrents follow their category's save path (radarr -> movies,
# sonarr -> tv) instead of piling into the root of /data/torrents.
Session\UseCategoryPathsInManualMode=true
Session\DisableAutoTMMByDefault=false
Session\DisableAutoTMMTriggers\CategorySavePathChanged=false
Session\TempPathEnabled=false
Session\Port=6881
Session\UseAlternativeGlobalSpeedLimit=false
Session\GlobalMaxRatio=-1
Session\QueueingSystemEnabled=false
# More peers per torrent than the default 100: big public swarms (thousands of peers)
# otherwise download from a small slice. ~200 seeding torrents share the global pool.
Session\MaxConnections=1000
Session\MaxConnectionsPerTorrent=250

[Preferences]
WebUI\Port=8080
WebUI\Address=*
WebUI\LocalHostAuth=false
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\AuthSubnetWhitelist=100.64.0.0/10, 172.16.0.0/12
WebUI\CSRFProtection=true
WebUI\HostHeaderValidation=true
Downloads\SavePath=/data/torrents
Downloads\TempPathEnabled=false
General\Locale=en
