      - size: small
        widgets:
          - type: rss
            title: News
            limit: 30
            collapse-after: 13
            cache: 1h
            feeds:
              - {url: "https://feeds.bloomberg.com/markets/news.rss", title: Bloomberg}
              - {url: "https://www.ft.com/technology?format=rss", title: Financial Times}
