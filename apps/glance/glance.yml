# Glance's pages, widgets and YouTube rows.
# Read by: glance, from apps/glance mounted read-only at /app/config.
# Applies: Glance reloads it on save; a missing environment variable stops the reload.
server:
  port: 8080
  assets-path: /app/config/assets

document:
  head: |
    <script src="/assets/meeting-theme.js" defer></script>

branding:
  hide-footer: true

theme:
  custom-css-file: /assets/media.css
  presets:
    teal-city: {background-color: 225 14 15, primary-color: 157 47 65, contrast-multiplier: 1.1}
    catppuccin-frappe: {background-color: 229 19 23, primary-color: 222 74 74, positive-color: 96 44 68, negative-color: 359 68 71, contrast-multiplier: 1.2}
    catppuccin-macchiato: {background-color: 232 23 18, primary-color: 220 83 75, positive-color: 105 48 72, negative-color: 351 74 73, contrast-multiplier: 1.2}
    catppuccin-mocha: {background-color: 240 21 15, primary-color: 217 92 83, positive-color: 115 54 76, negative-color: 347 70 65, contrast-multiplier: 1.2}
    tokyo-night: {background-color: 235 19 13, primary-color: 221 89 72, positive-color: 89 51 61, negative-color: 349 89 72, contrast-multiplier: 1.2}
    nord: {background-color: 220 16 22, primary-color: 193 43 67, positive-color: 92 28 65, negative-color: 354 42 56, contrast-multiplier: 1.2}
    one-dark: {background-color: 220 13 18, primary-color: 207 82 66, positive-color: 95 38 62, negative-color: 355 65 65, contrast-multiplier: 1.2}
    rose-pine: {background-color: 249 22 12, primary-color: 2 55 83, positive-color: 189 43 73, negative-color: 343 76 68, contrast-multiplier: 1.2}
    dracula: {background-color: 231 15 21, primary-color: 265 89 79, positive-color: 135 94 66, negative-color: 0 100 67, contrast-multiplier: 1.2}
    gruvbox-dark: {background-color: 0 0 16, primary-color: 43 59 81, positive-color: 61 66 44, negative-color: 6 96 59}
    kanagawa-dark: {background-color: 240 13 14, primary-color: 51 33 68, negative-color: 358 100 68, contrast-multiplier: 1.2}
    camouflage: {background-color: 186 21 20, primary-color: 97 13 80, contrast-multiplier: 1.2}
    tucan: {background-color: 50 1 6, primary-color: 24 97 58, negative-color: 209 88 54}
    shades-of-purple: {background-color: 243 33 25, primary-color: 50 100 49, positive-color: 98 82 71, negative-color: 12 77 52, contrast-multiplier: 1.2}
    neon-pink: {background-color: 240 27 11, primary-color: 321 100 71, positive-color: 165 78 51, negative-color: 360 100 71, contrast-multiplier: 1.5}
    catppuccin-latte: {light: true, background-color: 220 23 95, primary-color: 220 91 54, positive-color: 109 58 40, negative-color: 347 87 44}
    solarized-light: {light: true, background-color: 44 87 94, primary-color: 205 69 49, positive-color: 68 100 30, negative-color: 1 71 52, contrast-multiplier: 1.1}
    peachy: {light: true, background-color: 28 40 77, primary-color: 155 100 20, negative-color: 0 100 60, contrast-multiplier: 1.1, text-saturation-multiplier: 0.5}
    zebra: {light: true, background-color: 0 0 95, primary-color: 0 0 10, negative-color: 0 90 50}

pages:
  - name: Lab
    columns:
      - size: small
        widgets:
          - type: server-stats
            servers:
              - type: local
                name: ${HOST_NAME}
                hide-mountpoints-by-default: true
                mountpoints:
                  /: {name: NVMe, hide: false}
                  /media-drive: {name: Media drive, hide: false}

          - type: custom-api
            title: Media drive
            title-url: http://${HOST_NAME}:3006
            cache: 30m
            url: http://scrutiny:8080/api/summary
            template: |
              {{ $prom := "http://prometheus:9090/api/v1/query" }}
              {{ $avail := (newRequest $prom | withParameter "query" `node_filesystem_avail_bytes{mountpoint="${STORAGE_MOUNT}"}` | getResponse).JSON.Float "data.result.0.value.1" }}
              {{ $size := (newRequest $prom | withParameter "query" `node_filesystem_size_bytes{mountpoint="${STORAGE_MOUNT}"}` | getResponse).JSON.Float "data.result.0.value.1" }}
              {{ $growth := (newRequest $prom | withParameter "query" `-deriv(node_filesystem_avail_bytes{mountpoint="${STORAGE_MOUNT}"}[7d]) * 86400` | getResponse).JSON.Float "data.result.0.value.1" }}
              {{ $used := sub $size $avail }}
              <div class="flex justify-between items-end">
                <div><span class="color-highlight size-h3">{{ div $avail 1e12 | printf "%.1f" }} TB</span> <span class="size-h6">FREE</span></div>
                <div class="size-h6">OF {{ div $size 1e12 | printf "%.1f" }} TB</div>
              </div>
              <div class="media-progress"><div style="width: {{ div $used $size | mul 100.0 | printf "%.0f" }}%"></div></div>
              {{ if gt $growth 1e9 }}
                {{ $days := div $avail $growth }}
                <p class="size-h6 margin-top-10">Growing {{ div $growth 1e9 | printf "%.0f" }} GB a day</p>
                <p class="{{ if lt $days 30.0 }}color-negative{{ else }}color-highlight{{ end }}">Full around {{ offsetNow (printf "+%dh" (toInt (mul $days 24.0))) | formatTime "Jan 2" }} at this rate</p>
              {{ else }}
                <p class="size-h6 margin-top-10">Not growing this week</p>
              {{ end }}
              <ul class="list list-gap-8 margin-top-15">
              {{ range .JSON.Array "data.summary|@values" }}
                {{ $ok := eq (.Int "device.device_status") 0 }}
                <li class="flex justify-between"><span>SMART</span><span class="{{ if $ok }}color-positive{{ else }}color-negative{{ end }}">{{ if $ok }}Passed{{ else }}Failing{{ end }}</span></li>
                <li class="flex justify-between"><span>Temperature</span><span class="color-highlight">{{ .Int "smart.temp" }}°C</span></li>
                <li class="flex justify-between"><span>Powered on</span><span>{{ div (.Int "smart.power_on_hours") 24 }} days</span></li>
                <li class="flex justify-between"><span>Model</span><span class="text-truncate">{{ .String "device.model_name" }}</span></li>
              {{ end }}
              </ul>

          - type: custom-api
            title: Library
            cache: 1h
            url: http://jellyfin:8096/Items/Counts
            headers: &jellyfin-auth
              Authorization: MediaBrowser Token="${JELLYFIN_API_KEY}"
            template: |
              {{ $prom := "http://prometheus:9090/api/v1/query" }}
              {{ $movies := (newRequest $prom | withParameter "query" "radarr_disk_size" | getResponse).JSON.Float "data.result.0.value.1" }}
              {{ $tv := (newRequest $prom | withParameter "query" "sonarr_disk_size" | getResponse).JSON.Float "data.result.0.value.1" }}
              <div class="flex justify-between text-center">
                <div><div class="color-highlight size-h3">{{ .JSON.Int "MovieCount" }}</div><div class="size-h6">MOVIES</div></div>
                <div><div class="color-highlight size-h3">{{ .JSON.Int "SeriesCount" }}</div><div class="size-h6">SHOWS</div></div>
                <div><div class="color-highlight size-h3">{{ .JSON.Int "EpisodeCount" }}</div><div class="size-h6">EPISODES</div></div>
              </div>
              <ul class="list list-gap-8 margin-top-15">
                <li class="flex justify-between"><span>Movies on disk</span><span class="color-highlight">{{ if gt $movies 1e12 }}{{ div $movies 1e12 | printf "%.2f TB" }}{{ else }}{{ div $movies 1e9 | printf "%.0f GB" }}{{ end }}</span></li>
                <li class="flex justify-between"><span>TV on disk</span><span class="color-highlight">{{ if gt $tv 1e12 }}{{ div $tv 1e12 | printf "%.2f TB" }}{{ else }}{{ div $tv 1e9 | printf "%.0f GB" }}{{ end }}</span></li>
              </ul>

          - type: monitor
            title: Apps
            cache: 1m
            style: compact
            sites:
              - {title: Jellyfin, icon: "di:jellyfin", url: "http://${HOST_NAME}:8096", check-url: "http://jellyfin:8096/health"}
              - {title: Seerr, icon: "di:jellyseerr", url: "http://${HOST_NAME}:5055", check-url: "http://seerr:5055/api/v1/status"}
              - {title: Music, icon: "di:navidrome", url: "${NEEDLE_PUBLIC_URL}", check-url: "http://needle:4535/api/health"}
              - {title: Questarr, icon: "mdi:gamepad-variant", url: "http://${HOST_NAME}:5000", check-url: "http://questarr:5000/api/health"}
              - {title: Games page, icon: "di:sftpgo.png", url: "http://${HOST_NAME}:8090", check-url: "http://sftpgo:8080/healthz"}

      - size: full
        widgets:
          - type: search
            search-engine: google
            autofocus: true
            bangs: &search-bangs
              - {title: YouTube, shortcut: "!yt", url: "https://www.youtube.com/results?search_query={QUERY}"}
              - {title: GitHub, shortcut: "!gh", url: "https://github.com/search?q={QUERY}&type=repositories"}
              - {title: Reddit, shortcut: "!r", url: "https://www.reddit.com/search/?q={QUERY}"}

          - type: docker-containers
            sock-path: tcp://socket-proxy:2375
            containers:
              jellyfin: {name: Jellyfin, icon: "di:jellyfin", url: "http://${HOST_NAME}:8096", description: Media server}
              seerr: {name: Seerr, icon: "di:jellyseerr", url: "http://${HOST_NAME}:5055", description: Requests}
              plex: {name: Plex, icon: "di:plex", url: "http://${HOST_NAME}:32400/web", description: "Unclaimed, optional"}
              navidrome: {name: Navidrome, icon: "di:navidrome", url: "http://${HOST_NAME}:4533", description: Music server}
              needle: {name: Needle, icon: "di:navidrome", url: "${NEEDLE_PUBLIC_URL}", description: Music player}
              sonarr: {name: Sonarr, icon: "di:sonarr", url: "http://${HOST_NAME}:8989", description: TV}
              radarr: {name: Radarr, icon: "di:radarr", url: "http://${HOST_NAME}:7878", description: Movies}
              lidarr: {name: Lidarr, icon: "di:lidarr", url: "http://${HOST_NAME}:8686", description: Music}
              bazarr: {name: Bazarr, icon: "di:bazarr", url: "http://${HOST_NAME}:6767", description: Subtitles}
              prowlarr: {name: Prowlarr, icon: "di:prowlarr", url: "http://${HOST_NAME}:9696", description: Indexers}
              questarr: {name: Questarr, icon: "mdi:gamepad-variant", url: "http://${HOST_NAME}:5000", description: Games}
              sftpgo: {name: SFTPGo, icon: "di:sftpgo.png", url: "http://${HOST_NAME}:8090", description: Game downloads}
              gluetun: {name: Gluetun, icon: "di:gluetun", description: ProtonVPN tunnel}
              qbittorrent: {name: qBittorrent, icon: "di:qbittorrent", url: "http://${HOST_NAME}:${QBIT_PORT}", description: "Torrents, behind the VPN"}
              slskd: {name: slskd, icon: "di:slskd", url: "http://${HOST_NAME}:5030", description: "Soulseek, behind the VPN"}
              sabnzbd: {name: SABnzbd, icon: "di:sabnzbd", url: "http://${HOST_NAME}:8085", description: Usenet}
              cleanuparr: {name: Cleanuparr, icon: "di:cleanuparr.png", url: "http://${HOST_NAME}:11011", description: Removes stalled downloads}
              recyclarr: {name: Recyclarr, icon: "di:recyclarr", description: TRaSH quality profiles}
              byparr: {name: Byparr, icon: "di:flaresolverr", description: Cloudflare solver}
              homepage: {name: Homepage, icon: "di:homepage.png", url: "http://${HOST_NAME}:3000", description: Ops dashboard}
              glance: {name: Glance, icon: "di:glance", url: "http://${HOST_NAME}:3005", description: This page}
              scrutiny: {name: Scrutiny, icon: "di:scrutiny", url: "http://${HOST_NAME}:3006", description: Drive SMART history}
              changedetection: {name: ChangeDetection, icon: "di:changedetection", url: "http://${HOST_NAME}:3007", description: Watched web pages}
              grafana: {name: Grafana, icon: "di:grafana", url: "http://${HOST_NAME}:3001", description: Metrics history}
              prometheus: {name: Prometheus, icon: "di:prometheus", url: "http://${HOST_NAME}:9090", description: Metrics}
              uptime-kuma: {name: Uptime Kuma, icon: "di:uptime-kuma", url: "http://${HOST_NAME}:3003/status/stack", description: Down alerts}
              dozzle: {name: Dozzle, icon: "di:dozzle", url: "http://${HOST_NAME}:8888", description: Container logs}
              jellystat: {name: Jellystat, icon: "di:jellystat", url: "http://${HOST_NAME}:3002", description: Watch history}
              jellydash: {name: JellyDash, icon: "di:jellyfin", url: "http://${HOST_NAME}:3004", description: Now playing and stats}
              jellystat-db: {hide: true}
              node-exporter: {hide: true}
              scraparr: {hide: true}
              socket-proxy: {hide: true}

      - size: small
        widgets:
          - type: custom-api
            title: Uptime
            title-url: http://${HOST_NAME}:3003/status/stack
            cache: 2m
            url: http://uptime-kuma:3001/api/status-page/stack
            subrequests:
              heartbeats:
                url: http://uptime-kuma:3001/api/status-page/heartbeat/stack
            template: |
              {{ $hb := (.Subrequest "heartbeats").JSON }}
              {{ $up := 0 }}{{ $down := 0 }}{{ $uptime := 0.0 }}
              {{ range .JSON.Array "publicGroupList" }}{{ range .Array "monitorList" }}
                {{ $beats := $hb.Array (printf "heartbeatList.%d" (.Int "id")) }}
                {{ if and (gt (len $beats) 0) (eq ((index $beats (sub (len $beats) 1)).Int "status") 1) }}{{ $up = add $up 1 }}{{ else }}{{ $down = add $down 1 }}{{ end }}
                {{ $uptime = add $uptime ($hb.Float (printf "uptimeList.%d_24" (.Int "id"))) }}
              {{ end }}{{ end }}
              <div class="flex justify-between text-center">
                <div><div class="color-positive size-h3">{{ $up }}</div><div class="size-h6">UP</div></div>
                <div><div class="{{ if gt $down 0 }}color-negative{{ else }}color-highlight{{ end }} size-h3">{{ $down }}</div><div class="size-h6">DOWN</div></div>
                <div><div class="color-highlight size-h3">{{ div $uptime (toFloat (add $up $down)) | mul 100.0 | printf "%.2f" }}%</div><div class="size-h6">24H</div></div>
              </div>
              <ul class="list list-gap-8 margin-top-15">
              {{ range .JSON.Array "publicGroupList" }}{{ range .Array "monitorList" }}
                {{ $beats := $hb.Array (printf "heartbeatList.%d" (.Int "id")) }}
                {{ $upNow := and (gt (len $beats) 0) (eq ((index $beats (sub (len $beats) 1)).Int "status") 1) }}
                {{ $day := $hb.Float (printf "uptimeList.%d_24" (.Int "id")) }}
                {{ if or (not $upNow) (lt $day 1.0) }}
                  <li class="flex justify-between"><span class="text-truncate">{{ .String "name" }}</span><span class="{{ if $upNow }}color-highlight{{ else }}color-negative{{ end }}">{{ if $upNow }}{{ mul $day 100.0 | printf "%.1f" }}%{{ else }}DOWN{{ end }}</span></li>
                {{ end }}
              {{ end }}{{ end }}
              </ul>

          - type: custom-api
            title: Maintenance
            cache: 10m
            template: |
              {{ $prom := "http://prometheus:9090/api/v1/query" }}
              {{ $updates := (newRequest $prom | withParameter "query" "arr_image_updates_available" | getResponse).JSON.Int "data.result.0.value.1" }}
              {{ $checked := (newRequest $prom | withParameter "query" "arr_image_updates_checked_timestamp_seconds" | getResponse).JSON.String "data.result.0.value.1" }}
              {{ $backup := (newRequest $prom | withParameter "query" "arr_backup_last_success_timestamp_seconds" | getResponse).JSON.String "data.result.0.value.1" }}
              {{ $backupAge := (newRequest $prom | withParameter "query" "time() - arr_backup_last_success_timestamp_seconds" | getResponse).JSON.Float "data.result.0.value.1" }}
              <ul class="list list-gap-10">
                <li>
                  <p class="{{ if gt $updates 0 }}color-highlight{{ else }}color-positive{{ end }}">{{ if gt $updates 0 }}{{ $updates }} image updates available{{ else }}All images up to date{{ end }}</p>
                  <p class="size-h6">checked <span {{ parseTime "unix" $checked | toRelativeTime }}></span> ago{{ if gt $updates 0 }} · apply with <code>update</code>{{ end }}</p>
                </li>
                <li>
                  <p class="{{ if or (eq $backup "") (gt $backupAge 172800.0) }}color-negative{{ else }}color-positive{{ end }}">{{ if eq $backup "" }}No backup recorded{{ else }}Settings backed up{{ end }}</p>
                  {{ if ne $backup "" }}<p class="size-h6"><span {{ parseTime "unix" $backup | toRelativeTime }}></span> ago · restic on the media drive</p>{{ end }}
                </li>
              </ul>

          - type: custom-api
            title: Indexers
            title-url: http://${HOST_NAME}:9696
            cache: 10m
            url: http://prowlarr:9696/api/v1/indexer
            headers: &prowlarr-auth
              X-Api-Key: ${PROWLARR_API_KEY}
            subrequests:
              status:
                url: http://prowlarr:9696/api/v1/indexerstatus
                headers: *prowlarr-auth
              bazarr:
                url: http://bazarr:6767/api/badges
                headers:
                  X-API-KEY: ${BAZARR_API_KEY}
            template: |
              {{ $indexers := .JSON.Array "" }}
              {{ $failing := 0 }}{{ $enabled := 0 }}
              {{ range $indexers }}{{ if .Bool "enable" }}{{ $enabled = add $enabled 1 }}{{ end }}{{ end }}
              {{ range (.Subrequest "status").JSON.Array "" }}{{ if (.String "disabledTill" | parseTime "RFC3339").After now }}{{ $failing = add $failing 1 }}{{ end }}{{ end }}
              {{ $bazarr := (.Subrequest "bazarr").JSON }}
              <div class="flex justify-between text-center">
                <div><div class="color-highlight size-h3">{{ $enabled }}</div><div class="size-h6">INDEXERS</div></div>
                <div><div class="{{ if gt $failing 0 }}color-negative{{ else }}color-positive{{ end }} size-h3">{{ $failing }}</div><div class="size-h6">BACKING OFF</div></div>
                <div><div class="color-highlight size-h3">{{ add ($bazarr.Int "episodes") ($bazarr.Int "movies") }}</div><div class="size-h6">SUBS WANTED</div></div>
              </div>
              <ul class="list list-gap-8 margin-top-15">
              {{ range (.Subrequest "status").JSON.Array "" }}
                {{ $until := .String "disabledTill" | parseTime "RFC3339" }}
                {{ if $until.After now }}
                  {{ $id := .Int "indexerId" }}
                  {{ range $indexers }}{{ if eq (.Int "id") $id }}
                    <li class="flex justify-between"><span class="text-truncate">{{ .String "name" }}</span><span class="color-negative shrink-0">retry {{ $until.In (now).Location | formatTime "3:04PM" }}</span></li>
                  {{ end }}{{ end }}
                {{ end }}
              {{ end }}
              {{ if gt ($bazarr.Int "providers") 0 }}<li class="flex justify-between"><span>Subtitle providers throttled</span><span class="color-highlight">{{ $bazarr.Int "providers" }}</span></li>{{ end }}
              </ul>

          - type: releases
            show-source-icon: true
            limit: 15
            collapse-after: 6
            repositories:
              - glanceapp/glance
              - jellyfin/jellyfin
              - seerr-team/seerr
              - Sonarr/Sonarr
              - Radarr/Radarr
              - Lidarr/Lidarr
              - Prowlarr/Prowlarr
              - qdm12/gluetun
              - qbittorrent/qBittorrent
              - slskd/slskd
              - navidrome/navidrome
              - gethomepage/homepage

          - type: iframe
            title: Meeting mode
            source: http://${HOST_NAME}:4536/
            height: 200

  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: sunday

          - type: rss
            title: Blogs
            limit: 15
            collapse-after: 4
            cache: 6h
            feeds:
              - {url: "https://newsletter.pragmaticengineer.com/feed", title: The Pragmatic Engineer}
              - {url: "https://simonwillison.net/atom/everything/", title: Simon Willison}
              - {url: "https://jvns.ca/atom.xml", title: Julia Evans}
              - {url: "https://martinfowler.com/feed.atom", title: Martin Fowler}
              - {url: "https://github.blog/feed/", title: GitHub Blog}
              - {url: "https://selfh.st/rss/", title: selfh.st, limit: 4}

          - type: twitch-channels
            channels: [theprimeagen, zackrawrr, raxxanterax, rhykker, fextralife, christitustech]

          - type: change-detection
            title: Watched pages
            title-url: http://${HOST_NAME}:3007
            instance-url: http://changedetection:5000
            token: ${CHANGEDETECTION_API_KEY}
            limit: 10
            collapse-after: 5

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            autofocus: true
            new-tab: true
            bangs: *search-bangs

          - type: group
            widgets:
              - type: hacker-news
                sort-by: top
                limit: 20
                collapse-after: 5
              - type: lobsters
                sort-by: hot
                limit: 20
                collapse-after: 5

          # Latest uploads written hourly by scripts/youtube-sync.py (YouTube's RSS feed is unreliable),
          # in the markup of Glance's own videos widget.
          - &youtube
            type: custom-api
            title: Videos
            url: http://127.0.0.1:8080/assets/youtube/tech.json
            cache: 15m
            frameless: true
            options: {grid: false}
            template: |
              {{ $grid := .Options.BoolOr "grid" false }}
              {{ if $grid }}<div class="cards-grid collapsible-container" data-collapse-after-rows="3">
              {{ else }}<div class="carousel-container"><div class="cards-horizontal carousel-items-container">{{ end }}
              {{ range .JSON.Array "videos" }}
                <div class="card widget-content-frame thumbnail-parent">
                  <img class="video-thumbnail thumbnail" loading="lazy" src="https://i.ytimg.com/vi/{{ .String "id" }}/mqdefault.jpg" alt="">
                  <div class="margin-top-10 margin-bottom-widget flex flex-column grow padding-inline-widget">
                    <a class="text-truncate-2-lines margin-bottom-auto color-primary-if-not-visited" href="https://www.youtube.com/watch?v={{ .String "id" }}" target="_blank" rel="noreferrer">{{ .String "title" }}</a>
                    <ul class="list-horizontal-text flex-nowrap margin-top-7">
                      <li class="shrink-0" {{ .String "published" | parseRelativeTime "rfc3339" }}></li>
                      <li class="min-width-0"><a class="block text-truncate" href="https://www.youtube.com/channel/{{ .String "channel_id" }}" target="_blank" rel="noreferrer">{{ .String "channel" }}</a></li>
                    </ul>
                  </div>
                </div>
              {{ else }}
                <p class="padding-widget">No videos yet; the hourly YouTube sync fills this row.</p>
              {{ end }}
              </div>{{ if not $grid }}</div>{{ end }}

          # Reddit refuses its JSON API from this IP and rate-limits RSS to about
          # one request at a time, so every subreddit shares one feed (r/a+b/.rss).
          - type: group
            widgets:
              - &detailed
                type: rss
                title: Reddit
                style: detailed-list
                limit: 25
                collapse-after: 6
                cache: 2h
                feeds:
                  - url: "https://www.reddit.com/r/selfhosted+homelab+technology+programming+gaming+pcgaming/.rss"
                    hide-description: true
              - {<<: *detailed, title: Ars Technica, cache: 1h, feeds: [{url: "https://feeds.arstechnica.com/arstechnica/index"}]}

      - size: small
        widgets:
          - type: weather
            location: ${WEATHER_LOCATION}
            units: imperial
            hour-format: 12h

          - type: markets
            markets: &stocks
              - {symbol: AAPL, name: Apple}
              - {symbol: MSFT, name: Microsoft}
              - {symbol: NVDA, name: NVIDIA}
              - {symbol: GOOG, name: Alphabet}
              - {symbol: AMZN, name: Amazon}

          - type: group
            widgets:
              - type: custom-api
                title: Next race
                title-url: https://www.formula1.com/en/racing/2026
                cache: 1h
                url: https://f1api.dev/api/current/next?timezone=${TZ}
                template: |
                  {{ define "when" }}{{ if eq (.String "date") "" }}TBC{{ else if eq (.String "time") "" }}{{ .String "date" | parseLocalTime "DateOnly" | formatTime "Mon Jan 2" }}{{ else }}{{ concat (.String "date") "T" (.String "time") | parseLocalTime "2006-01-02T15:04:05" | formatTime "Mon Jan 2, 3:04PM" }}{{ end }}{{ end }}
                  {{ $race := index (.JSON.Array "race") 0 }}
                  <p class="size-h6">ROUND {{ .JSON.Int "round" }} · {{ $race.String "circuit.city" }}, {{ $race.String "circuit.country" }}</p>
                  <p class="color-highlight size-h3">{{ $race.String "raceName" | trimPrefix "Formula 1 " }}</p>
                  <ul class="list list-gap-8 margin-top-10 size-h5">
                    <li class="flex justify-between"><span>Race</span><span class="color-highlight">{{ template "when" ($race.Get "schedule.race") }}</span></li>
                    <li class="flex justify-between"><span>Qualifying</span><span>{{ template "when" ($race.Get "schedule.qualy") }}</span></li>
                    {{ if ne ($race.String "schedule.sprintRace.date") "" }}<li class="flex justify-between"><span>Sprint</span><span>{{ template "when" ($race.Get "schedule.sprintRace") }}</span></li>{{ end }}
                    <li class="flex justify-between"><span>Practice 1</span><span>{{ template "when" ($race.Get "schedule.fp1") }}</span></li>
                  </ul>

              - type: custom-api
                title: Drivers
                cache: 6h
                url: https://f1api.dev/api/current/drivers-championship
                template: |
                  <ul class="list list-gap-8 collapsible-container" data-collapse-after="5">
                  {{ range $i, $d := .JSON.Array "drivers_championship" }}
                    <li class="flex justify-between {{ if eq $i 0 }}color-primary{{ else if lt $i 3 }}color-highlight{{ end }}">
                      <span class="text-truncate">{{ $d.Int "position" }}. {{ $d.String "driver.name" }} {{ $d.String "driver.surname" }}</span>
                      <span class="shrink-0">{{ $d.Int "points" }}</span>
                    </li>
                  {{ end }}
                  </ul>

              - type: custom-api
                title: Teams
                cache: 6h
                url: https://f1api.dev/api/current/constructors-championship
                template: |
                  <ul class="list list-gap-8 collapsible-container" data-collapse-after="5">
                  {{ range $i, $t := .JSON.Array "constructors_championship" }}
                    <li class="flex justify-between {{ if eq $i 0 }}color-primary{{ else if lt $i 3 }}color-highlight{{ end }}">
                      <span class="text-truncate">{{ $t.Int "position" }}. {{ $t.String "team.teamName" }}</span>
                      <span class="shrink-0">{{ $t.Int "points" }}</span>
                    </li>
                  {{ end }}
                  </ul>

              - type: custom-api
                title: Last race
                cache: 6h
                url: https://f1api.dev/api/current/next
                template: |
                  {{ $last := newRequest (printf "https://f1api.dev/api/%d/%d/race" (.JSON.Int "season") (sub (.JSON.Int "round") 1)) | getResponse }}
                  <p class="size-h6">{{ $last.JSON.String "races.raceName" | trimPrefix "Formula 1 " }}</p>
                  <ul class="list list-gap-8 margin-top-10 collapsible-container" data-collapse-after="5">
                  {{ range $i, $r := $last.JSON.Array "races.results" }}
                    <li class="flex justify-between {{ if eq $i 0 }}color-primary{{ else if lt $i 3 }}color-highlight{{ end }}">
                      <span class="text-truncate">{{ $r.String "position" }}. {{ $r.String "driver.name" }} {{ $r.String "driver.surname" }}</span>
                      <span class="shrink-0">{{ $r.String "time" }}</span>
                    </li>
                  {{ end }}
                  </ul>

          - type: bookmarks
            groups:
              - title: Stack
                links:
                  - {title: Homepage, url: "http://${HOST_NAME}:3000"}
                  - {title: Grafana, url: "http://${HOST_NAME}:3001"}
                  - {title: Uptime Kuma, url: "http://${HOST_NAME}:3003/status/stack"}
                  - {title: Dozzle, url: "http://${HOST_NAME}:8888"}
                  - {title: JellyDash, url: "http://${HOST_NAME}:3004"}
                  - {title: Tailscale admin, url: "https://login.tailscale.com/admin/machines"}
              - title: Developer
                links:
                  - {title: GitHub, url: "https://github.com/"}
                  - {title: Hacker News, url: "https://news.ycombinator.com/"}
                  - {title: Stack Overflow, url: "https://stackoverflow.com/"}
                  - {title: MDN, url: "https://developer.mozilla.org/"}
                  - {title: DevDocs, url: "https://devdocs.io/"}
                  - {title: regex101, url: "https://regex101.com/"}
                  - {title: Excalidraw, url: "https://excalidraw.com/"}
              - title: Gaming
                links:
                  - {title: Steam, url: "https://store.steampowered.com/"}
                  - {title: Epic Games, url: "https://store.epicgames.com/"}
                  - {title: ProtonDB, url: "https://www.protondb.com/"}
                  - {title: HowLongToBeat, url: "https://howlongtobeat.com/"}
                  - {title: IsThereAnyDeal, url: "https://isthereanydeal.com/"}
              - title: Daily
                links:
                  - {title: Gmail, url: "https://mail.google.com/"}
                  - {title: Calendar, url: "https://calendar.google.com/"}
                  - {title: Yahoo Finance, url: "https://finance.yahoo.com/"}
                  - {title: YouTube, url: "https://youtube.com/"}
                  - {title: Reddit, url: "https://reddit.com/"}

  - name: Media
    columns:
      - size: full
        widgets:
          - type: group
            widgets:
              - type: custom-api
                title: Recently added movies
                title-url: http://${HOST_NAME}:8096
                cache: 15m
                frameless: true
                url: http://jellyfin:8096/Items?IncludeItemTypes=Movie&Recursive=true&SortBy=DateCreated&SortOrder=Descending&Limit=20&Fields=DateCreated
                headers: *jellyfin-auth
                template: |
                  <div class="carousel-container"><div class="cards-horizontal carousel-items-container">
                  {{ range .JSON.Array "Items" }}
                    <div class="card widget-content-frame thumbnail-parent">
                      <img class="poster thumbnail" loading="lazy" src="http://${HOST_NAME}:8096/Items/{{ .String "Id" }}/Images/Primary?fillHeight=450&quality=90" alt="">
                      <div class="padding-inline-widget margin-bottom-widget margin-top-10">
                        <a class="color-primary-if-not-visited text-truncate block" href="http://${HOST_NAME}:8096/web/#/details?id={{ .String "Id" }}" target="_blank">{{ .String "Name" }}</a>
                        <ul class="list-horizontal-text size-h6"><li>{{ .Int "ProductionYear" }}</li><li {{ .String "DateCreated" | parseTime "RFC3339" | toRelativeTime }}></li></ul>
                      </div>
                    </div>
                  {{ end }}
                  </div></div>

              - type: custom-api
                title: New episodes
                title-url: http://${HOST_NAME}:8096
                cache: 15m
                frameless: true
                url: http://jellyfin:8096/Items?IncludeItemTypes=Episode&Recursive=true&SortBy=DateCreated&SortOrder=Descending&Limit=60&Fields=DateCreated
                headers: *jellyfin-auth
                template: |
                  <div class="carousel-container"><div class="cards-horizontal carousel-items-container">
                  {{ range .JSON.Array "Items" | unique "SeriesId" }}
                    <div class="card widget-content-frame thumbnail-parent">
                      <img class="poster thumbnail" loading="lazy" src="http://${HOST_NAME}:8096/Items/{{ .String "SeriesId" }}/Images/Primary?fillHeight=450&quality=90" alt="">
                      <div class="padding-inline-widget margin-bottom-widget margin-top-10">
                        <a class="color-primary-if-not-visited text-truncate block" href="http://${HOST_NAME}:8096/web/#/details?id={{ .String "SeriesId" }}" target="_blank">{{ .String "SeriesName" }}</a>
                        <ul class="list-horizontal-text size-h6"><li>S{{ .Int "ParentIndexNumber" }}E{{ .Int "IndexNumber" }}</li><li {{ .String "DateCreated" | parseTime "RFC3339" | toRelativeTime }}></li></ul>
                      </div>
                    </div>
                  {{ end }}
                  </div></div>

          - type: group
            widgets:
              - type: custom-api
                title: Coming up on TV
                title-url: http://${HOST_NAME}:8989/calendar
                cache: 30m
                frameless: true
                template: |
                  {{ $r := newRequest "http://sonarr:8989/api/v3/calendar"
                    | withHeader "X-Api-Key" "${SONARR_API_KEY}"
                    | withParameter "includeSeries" "true"
                    | withParameter "start" (now | formatTime "DateOnly")
                    | withParameter "end" (offsetNow "+336h" | formatTime "DateOnly")
                    | getResponse }}
                  {{ $episodes := $r.JSON.Array "" }}
                  {{ if eq (len $episodes) 0 }}
                    <div class="widget-content-frame padding-widget color-subdue">Nothing in the next two weeks</div>
                  {{ else }}
                  <div class="carousel-container"><div class="cards-horizontal carousel-items-container">
                  {{ range $episodes }}
                    {{ $poster := "" }}
                    {{ range .Array "series.images" }}{{ if eq (.String "coverType") "poster" }}{{ $poster = .String "remoteUrl" }}{{ end }}{{ end }}
                    {{ $airs := .String "airDateUtc" | parseTime "RFC3339" }}
                    <div class="card widget-content-frame thumbnail-parent">
                      <img class="poster thumbnail" loading="lazy" src="{{ $poster }}" alt="">
                      <div class="padding-inline-widget margin-bottom-widget margin-top-10">
                        <a class="color-primary-if-not-visited text-truncate block" href="http://${HOST_NAME}:8989/series/{{ .String "series.titleSlug" }}" target="_blank">{{ .String "series.title" }}</a>
                        <ul class="list-horizontal-text size-h6"><li>S{{ .Int "seasonNumber" }}E{{ .Int "episodeNumber" }}</li><li>{{ $airs.In (now).Location | formatTime "Mon Jan 2, 3:04PM" }}</li></ul>
                      </div>
                    </div>
                  {{ end }}
                  </div></div>
                  {{ end }}

              - type: custom-api
                title: Coming up in movies
                title-url: http://${HOST_NAME}:7878/calendar
                cache: 1h
                frameless: true
                template: |
                  {{ $r := newRequest "http://radarr:7878/api/v3/calendar"
                    | withHeader "X-Api-Key" "${RADARR_API_KEY}"
                    | withParameter "start" (now | formatTime "DateOnly")
                    | withParameter "end" (offsetNow "+2160h" | formatTime "DateOnly")
                    | getResponse }}
                  <div class="carousel-container"><div class="cards-horizontal carousel-items-container">
                  {{ range $r.JSON.Array "" | sortByTime "releaseDate" "RFC3339" "asc" }}
                    {{ if not (.Bool "hasFile") }}
                      {{ $poster := "" }}
                      {{ range .Array "images" }}{{ if eq (.String "coverType") "poster" }}{{ $poster = .String "remoteUrl" }}{{ end }}{{ end }}
                      <div class="card widget-content-frame thumbnail-parent">
                        <img class="poster thumbnail" loading="lazy" src="{{ $poster }}" alt="">
                        <div class="padding-inline-widget margin-bottom-widget margin-top-10">
                          <a class="color-primary-if-not-visited text-truncate block" href="http://${HOST_NAME}:7878/movie/{{ .String "titleSlug" }}" target="_blank">{{ .String "title" }}</a>
                          <ul class="list-horizontal-text size-h6"><li>{{ if .Exists "digitalRelease" }}Digital {{ .String "digitalRelease" | parseTime "RFC3339" | formatTime "Jan 2" }}{{ else }}Cinemas {{ .String "inCinemas" | parseTime "RFC3339" | formatTime "Jan 2" }}{{ end }}</li></ul>
                        </div>
                      </div>
                    {{ end }}
                  {{ end }}
                  </div></div>

              - type: custom-api
                title: Coming up in music
                title-url: http://${HOST_NAME}:8686/calendar
                cache: 6h
                frameless: true
                template: |
                  {{ $r := newRequest "http://lidarr:8686/api/v1/calendar"
                    | withHeader "X-Api-Key" "${LIDARR_API_KEY}"
                    | withParameter "includeArtist" "true"
                    | withParameter "unmonitored" "true"
                    | withParameter "start" (now | formatTime "DateOnly")
                    | withParameter "end" (offsetNow "+1440h" | formatTime "DateOnly")
                    | getResponse }}
                  {{ $albums := $r.JSON.Array "" }}
                  {{ if eq (len $albums) 0 }}
                    <div class="widget-content-frame padding-widget color-subdue">No new albums from your artists in the next 60 days</div>
                  {{ else }}
                  <div class="carousel-container"><div class="cards-horizontal carousel-items-container">
                  {{ range $albums | sortByTime "releaseDate" "RFC3339" "asc" }}
                    {{ $cover := "" }}
                    {{ range .Array "images" }}{{ if eq (.String "coverType") "cover" }}{{ $cover = .String "remoteUrl" }}{{ end }}{{ end }}
                    <div class="card widget-content-frame thumbnail-parent">
                      <img class="cover thumbnail" loading="lazy" src="{{ $cover }}" alt="">
                      <div class="padding-inline-widget margin-bottom-widget margin-top-10">
                        <a class="color-primary-if-not-visited text-truncate block" href="http://${HOST_NAME}:8686/album/{{ .String "foreignAlbumId" }}" target="_blank">{{ .String "title" }}</a>
                        <ul class="list-horizontal-text size-h6"><li class="text-truncate">{{ .String "artist.artistName" }}</li><li class="shrink-0">{{ .String "releaseDate" | parseTime "RFC3339" | formatTime "Jan 2" }}</li></ul>
                      </div>
                    </div>
                  {{ end }}
                  </div></div>
                  {{ end }}

          - type: custom-api
            title: Recent requests
            title-url: http://${HOST_NAME}:5055/requests
            cache: 10m
            frameless: true
            url: http://seerr:5055/api/v1/request?take=15&sort=added&filter=all
            headers: &seerr-auth
              X-Api-Key: ${SEERR_API_KEY}
            template: |
              <div class="carousel-container"><div class="cards-horizontal carousel-items-container">
              {{ range .JSON.Array "results" }}
                {{ $type := .String "type" }}
                {{ $id := .Int "media.tmdbId" }}
                {{ $media := newRequest (printf "http://seerr:5055/api/v1/%s/%d" $type $id) | withHeader "X-Api-Key" "${SEERR_API_KEY}" | getResponse }}
                {{ $status := .Int "media.status" }}
                <div class="card widget-content-frame thumbnail-parent">
                  <img class="poster thumbnail" loading="lazy" src="https://image.tmdb.org/t/p/w300{{ $media.JSON.String "posterPath" }}" alt="">
                  <div class="padding-inline-widget margin-bottom-widget margin-top-10">
                    <a class="color-primary-if-not-visited text-truncate block" href="http://${HOST_NAME}:5055/{{ $type }}/{{ $id }}" target="_blank">{{ if eq $type "tv" }}{{ $media.JSON.String "name" }}{{ else }}{{ $media.JSON.String "title" }}{{ end }}</a>
                    <ul class="list-horizontal-text size-h6">
                      {{ if eq $status 5 }}<li class="color-positive">Available</li>
                      {{ else if eq $status 4 }}<li class="color-positive">Partly available</li>
                      {{ else if eq $status 3 }}<li class="color-highlight">Downloading</li>
                      {{ else if eq (.Int "status") 3 }}<li class="color-negative">Declined</li>
                      {{ else if eq (.Int "status") 1 }}<li class="color-highlight">Needs approval</li>
                      {{ else }}<li>Requested</li>{{ end }}
                      <li>{{ .String "requestedBy.displayName" }}</li>
                    </ul>
                  </div>
                </div>
              {{ end }}
              </div></div>


          - type: custom-api
            title: Most watched this month
            title-url: http://${HOST_NAME}:3002
            cache: 1h
            frameless: true
            url: http://jellystat:3000/stats/getMostViewedByType
            method: POST
            body-type: json
            body: {days: 30, type: Series}
            headers: &jellystat-auth
              x-api-token: ${JELLYSTAT_API_KEY}
            subrequests:
              movies:
                url: http://jellystat:3000/stats/getMostViewedByType
                method: POST
                body-type: json
                body: {days: 30, type: Movie}
                headers: *jellystat-auth
            template: |
              {{ define "watched" }}
                {{ range .JSON.Array "" }}
                  <div class="card widget-content-frame thumbnail-parent">
                    <img class="poster thumbnail" loading="lazy" src="http://${HOST_NAME}:8096/Items/{{ .String "Id" }}/Images/Primary?fillHeight=450&quality=90" alt="">
                    <div class="padding-inline-widget margin-bottom-widget margin-top-10">
                      <a class="color-primary-if-not-visited text-truncate block" href="http://${HOST_NAME}:8096/web/#/details?id={{ .String "Id" }}" target="_blank">{{ .String "Name" }}</a>
                      <ul class="list-horizontal-text size-h6"><li>{{ .Int "Plays" }} plays</li>{{ $seconds := .Int "total_playback_duration" }}<li>{{ if lt $seconds 3600 }}{{ div $seconds 60 }}m{{ else }}{{ div (toFloat $seconds) 3600.0 | printf "%.1f" }}h{{ end }}</li></ul>
                    </div>
                  </div>
                {{ end }}
              {{ end }}
              <div class="carousel-container"><div class="cards-horizontal carousel-items-container">
                {{ template "watched" . }}
                {{ template "watched" (.Subrequest "movies") }}
              </div></div>

      - size: small
        widgets:
          - type: custom-api
            title: VPN
            title-url: http://${HOST_NAME}:${QBIT_PORT}
            cache: 5m
            url: http://gluetun:${QBIT_PORT}/api/v2/transfer/info
            subrequests:
              port:
                url: http://gluetun:8000/v1/portforward
            template: |
              {{ $ip := .JSON.String "last_external_address_v4" }}
              {{ $status := .JSON.String "connection_status" }}
              {{ $port := (.Subrequest "port").JSON.Int "port" }}
              {{ $city := "" }}{{ $country := "" }}{{ $org := "" }}
              {{ if ne $ip "" }}
                {{ $geo := newRequest (printf "https://ipinfo.io/%s/json" $ip) | getResponse }}
                {{ $city = $geo.JSON.String "city" }}{{ $country = $geo.JSON.String "country" }}{{ $org = $geo.JSON.String "org" }}
              {{ end }}
              {{ $safe := and (ne $ip "") (eq $status "connected") (ne $country "US") (gt $port 0) }}
              <div class="flex items-center gap-15">
                <svg class="vpn-shield {{ if $safe }}color-positive{{ else }}color-negative{{ end }}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" /></svg>
                <div class="min-width-0">
                  <p class="size-h3 {{ if $safe }}color-positive{{ else }}color-negative{{ end }}">{{ if $safe }}Protected{{ else if eq $country "US" }}US exit!{{ else }}Check the VPN{{ end }}</p>
                  <p class="color-highlight text-truncate">{{ if ne $city "" }}{{ $city }}, {{ $country }}{{ else }}No exit address yet{{ end }}</p>
                  <p class="size-h6 text-truncate">{{ $org | replaceMatches "^AS[0-9]+ " "" }}</p>
                </div>
              </div>
              <ul class="list-horizontal-text size-h6 margin-top-10">
                <li>{{ $ip }}</li>
                <li>port {{ $port }}</li>
                <li>{{ $status }}</li>
              </ul>

          - type: custom-api
            title: Transfers
            cache: 30s
            url: http://gluetun:${QBIT_PORT}/api/v2/transfer/info
            subrequests:
              downloading:
                url: http://gluetun:${QBIT_PORT}/api/v2/torrents/info?filter=downloading
              seeding:
                url: http://gluetun:${QBIT_PORT}/api/v2/torrents/info?filter=seeding
              sabnzbd:
                url: http://sabnzbd:8080/api?mode=queue&output=json&apikey=${SABNZBD_API_KEY}
            template: |
              {{ $sab := (.Subrequest "sabnzbd").JSON }}
              {{ $cap := .JSON.Int "dl_rate_limit" }}
              <div class="flex justify-between text-center">
                <div><div class="color-highlight size-h3">{{ div (toFloat (.JSON.Int "dl_info_speed")) 1048576.0 | printf "%.1f" }}</div><div class="size-h6">TORRENT ↓</div></div>
                <div><div class="color-highlight size-h3">{{ div (toFloat (.JSON.Int "up_info_speed")) 1048576.0 | printf "%.1f" }}</div><div class="size-h6">TORRENT ↑</div></div>
                <div><div class="color-highlight size-h3">{{ div ($sab.Float "queue.kbpersec") 1024.0 | printf "%.1f" }}</div><div class="size-h6">USENET ↓</div></div>
              </div>
              <p class="size-h6 text-center margin-top-5">MB/s</p>
              <ul class="list-horizontal-text size-h6 margin-top-10">
                <li>{{ len ((.Subrequest "downloading").JSON.Array "") }} downloading</li>
                <li>{{ len ((.Subrequest "seeding").JSON.Array "") }} seeding</li>
                <li>{{ $sab.Int "queue.noofslots" }} in Usenet queue</li>
                {{ if gt $cap 0 }}<li class="color-highlight">capped at {{ div $cap 1048576 }} MB/s</li>{{ end }}
              </ul>

          - type: custom-api
            title: Torrents
            title-url: http://${HOST_NAME}:${QBIT_PORT}
            cache: 1m
            url: http://gluetun:${QBIT_PORT}/api/v2/torrents/info?filter=downloading&sort=progress&reverse=true
            template: |
              {{ $torrents := .JSON.Array "" }}
              {{ if eq (len $torrents) 0 }}
                <p class="color-subdue">No torrents downloading</p>
              {{ else }}
              <ul class="list list-gap-14 collapsible-container" data-collapse-after="5">
              {{ range $torrents }}
                {{ $eta := .Int "eta" }}
                <li>
                  <p class="color-highlight text-truncate" title="{{ .String "name" }}">{{ .String "name" }}</p>
                  <ul class="list-horizontal-text size-h6">
                    <li>{{ mul (.Float "progress") 100.0 | printf "%.0f" }}%</li>
                    <li>{{ div (toFloat (.Int "dlspeed")) 1048576.0 | printf "%.1f" }} MB/s</li>
                    {{ if lt $eta 8640000 }}<li>{{ if lt $eta 3600 }}{{ div $eta 60 }}m{{ else }}{{ div $eta 3600 }}h {{ div (mod $eta 3600) 60 }}m{{ end }} left</li>{{ end }}
                    <li>{{ .String "category" }}</li>
                  </ul>
                  <div class="media-progress"><div style="width: {{ mul (.Float "progress") 100.0 | printf "%.0f" }}%"></div></div>
                </li>
              {{ end }}
              </ul>
              {{ end }}

          - type: custom-api
            title: Now playing
            title-url: http://${HOST_NAME}:3004
            cache: 30s
            url: http://jellyfin:8096/Sessions?activeWithinSeconds=600
            headers: *jellyfin-auth
            template: |
              {{ $playing := 0 }}
              <ul class="list list-gap-20">
              {{ range .JSON.Array "" }}
                {{ if .Exists "NowPlayingItem" }}
                  {{ $playing = add $playing 1 }}
                  {{ $runtime := .Int "NowPlayingItem.RunTimeTicks" }}
                  {{ $episode := eq (.String "NowPlayingItem.Type") "Episode" }}
                  <li>
                    <img class="backdrop" loading="lazy" src="http://${HOST_NAME}:8096/Items/{{ .String "NowPlayingItem.Id" }}/Images/{{ if $episode }}Primary{{ else }}Backdrop{{ end }}?fillWidth=600&quality=90" alt="">
                    <p class="color-highlight text-truncate">
                      {{ if $episode }}{{ .String "NowPlayingItem.SeriesName" }} · S{{ .Int "NowPlayingItem.ParentIndexNumber" }}E{{ .Int "NowPlayingItem.IndexNumber" }}{{ else }}{{ .String "NowPlayingItem.Name" }}{{ end }}
                    </p>
                    <ul class="list-horizontal-text size-h6">
                      <li>{{ .String "UserName" }}</li>
                      <li>{{ .String "DeviceName" }}</li>
                      <li>{{ if .Bool "PlayState.IsPaused" }}Paused{{ else }}{{ .String "PlayState.PlayMethod" }}{{ end }}</li>
                    </ul>
                    {{ if gt $runtime 0 }}<div class="media-progress"><div style="width: {{ div (mul (.Int "PlayState.PositionTicks") 100) $runtime }}%"></div></div>{{ end }}
                  </li>
                {{ end }}
              {{ end }}
              </ul>
              {{ if eq $playing 0 }}<p class="color-subdue">Nothing is playing</p>{{ end }}

          - type: custom-api
            title: Requests
            title-url: http://${HOST_NAME}:5055/requests
            cache: 5m
            url: http://seerr:5055/api/v1/request/count
            headers: *seerr-auth
            template: |
              <div class="flex justify-between text-center">
                <div><div class="color-highlight size-h3">{{ .JSON.Int "pending" }}</div><div class="size-h6">PENDING</div></div>
                <div><div class="color-highlight size-h3">{{ .JSON.Int "processing" }}</div><div class="size-h6">DOWNLOADING</div></div>
                <div><div class="color-highlight size-h3">{{ .JSON.Int "completed" }}</div><div class="size-h6">AVAILABLE</div></div>
              </div>

          - type: custom-api
            title: Watching, last 30 days
            title-url: http://${HOST_NAME}:3002
            cache: 30m
            url: http://jellystat:3000/stats/getViewsOverTime?days=30
            headers: *jellystat-auth
            subrequests:
              users:
                url: http://jellystat:3000/stats/getMostActiveUsers
                method: POST
                body-type: json
                body: {days: 30}
                headers: *jellystat-auth
            template: |
              {{ $libraries := .JSON.Array "libraries" }}
              {{ $plays := 0 }}{{ $minutes := 0 }}
              {{ range .JSON.Array "stats" }}
                {{ $day := . }}
                {{ range $libraries }}
                  {{ $plays = add $plays ($day.Int (printf "%s.count" (.String "Name"))) }}
                  {{ $minutes = add $minutes ($day.Int (printf "%s.duration" (.String "Name"))) }}
                {{ end }}
              {{ end }}
              {{ $users := (.Subrequest "users").JSON.Array "" }}
              <div class="flex justify-between text-center">
                <div><div class="color-highlight size-h3">{{ $plays }}</div><div class="size-h6">PLAYS</div></div>
                <div><div class="color-highlight size-h3">{{ div (toFloat $minutes) 60.0 | printf "%.0f" }}</div><div class="size-h6">HOURS</div></div>
                <div><div class="color-highlight size-h3">{{ len $users }}</div><div class="size-h6">VIEWERS</div></div>
              </div>
              <ul class="list list-gap-8 margin-top-15">
              {{ range $users }}
                <li class="flex justify-between"><span class="text-truncate">{{ .String "Name" }}</span><span class="shrink-0">{{ .Int "Plays" }} plays</span></li>
              {{ end }}
              </ul>

          - type: custom-api
            title: Downloading
            cache: 1m
            template: |
              {{ define "queue" }}
                {{ range .JSON.Array "records" }}
                  {{ $size := .Float "size" }}
                  {{ $images := .Array "series.images" }}
                  {{ if .Exists "movie" }}{{ $images = .Array "movie.images" }}{{ end }}
                  {{ $poster := "" }}
                  {{ range $images }}{{ if eq (.String "coverType") "poster" }}{{ $poster = .String "remoteUrl" }}{{ end }}{{ end }}
                  <li class="flex gap-15 items-center">
                    <img class="thumb-poster" loading="lazy" src="{{ $poster }}" alt="">
                    <div class="min-width-0 grow">
                      <p class="color-highlight text-truncate">
                        {{ if .Exists "series" }}{{ .String "series.title" }} · S{{ .Int "episode.seasonNumber" }}E{{ .Int "episode.episodeNumber" }}{{ else }}{{ .String "movie.title" }}{{ end }}
                      </p>
                      <ul class="list-horizontal-text size-h6">
                        <li>{{ .String "status" }}</li>
                        {{ if .Exists "timeleft" }}<li>{{ .String "timeleft" }} left</li>{{ end }}
                      </ul>
                      {{ if gt $size 0.0 }}<div class="media-progress"><div style="width: {{ div (sub $size (.Float "sizeleft")) $size | mul 100.0 | printf "%.0f" }}%"></div></div>{{ end }}
                    </div>
                  </li>
                {{ end }}
              {{ end }}
              {{ $sonarr := newRequest "http://sonarr:8989/api/v3/queue"
                | withHeader "X-Api-Key" "${SONARR_API_KEY}"
                | withParameter "includeSeries" "true"
                | withParameter "includeEpisode" "true"
                | getResponse }}
              {{ $radarr := newRequest "http://radarr:7878/api/v3/queue"
                | withHeader "X-Api-Key" "${RADARR_API_KEY}"
                | withParameter "includeMovie" "true"
                | getResponse }}
              <ul class="list list-gap-14 collapsible-container" data-collapse-after="6">
                {{ template "queue" $sonarr }}
                {{ template "queue" $radarr }}
              </ul>
              {{ if eq (add ($sonarr.JSON.Int "totalRecords") ($radarr.JSON.Int "totalRecords")) 0 }}
                <p class="color-subdue">Nothing downloading</p>
              {{ end }}


  - name: Gaming
    columns:
      - size: small
        widgets:
          - type: twitch-top-games
            limit: 20
            collapse-after: 13
            exclude: [just-chatting, pools-hot-tubs-and-beaches, music, art, asmr]

      - size: full
        widgets:
          - type: rss
            title: News
            style: horizontal-cards
            limit: 25
            cache: 2h
            feeds:
              - {url: "https://www.pcgamer.com/rss/", title: PC Gamer}
              - {url: "https://www.rockpapershotgun.com/feed", title: Rock Paper Shotgun}
              - {url: "https://www.eurogamer.net/feed", title: Eurogamer}
              - {url: "https://www.gamingonlinux.com/article_rss.php", title: GamingOnLinux}

          - <<: *youtube
            url: http://127.0.0.1:8080/assets/youtube/gaming.json
            options: {grid: true}

      - size: small
        widgets:
          - type: custom-api
            title: Free on Epic
            title-url: https://store.epicgames.com/en-US/free-games
            cache: 6h
            url: https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=en-US&country=US&allowCountries=US
            template: |
              <ul class="list list-gap-10">
              {{ range .JSON.Array "data.Catalog.searchStore.elements" }}
                {{ $offer := .Get "promotions.promotionalOffers.0.promotionalOffers.0" }}
                {{ if and ($offer.Exists "endDate") (eq (.Int "price.totalPrice.discountPrice") 0) }}
                  {{ $slug := .String "productSlug" }}
                  {{ if .Exists "offerMappings.0.pageSlug" }}{{ $slug = .String "offerMappings.0.pageSlug" }}{{ end }}
                  <li>
                    <a class="color-highlight block text-truncate" href="https://store.epicgames.com/en-US/p/{{ $slug }}">{{ .String "title" }}</a>
                    <p class="size-h6 color-subdue">Free until {{ $offer.String "endDate" | parseTime "RFC3339" | formatTime "Jan 2" }}</p>
                  </li>
                {{ end }}
              {{ end }}
              </ul>

          - type: custom-api
            title: Steam deals
            title-url: https://store.steampowered.com/specials
            cache: 6h
            url: https://store.steampowered.com/api/featuredcategories?cc=us
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="6">
              {{ range .JSON.Array "specials.items" }}
                {{ $discount := .Int "discount_percent" }}
                <li>
                  <a class="color-highlight block text-truncate" href="https://store.steampowered.com/app/{{ .Int "id" }}/">{{ .String "name" }}</a>
                  <ul class="list-horizontal-text">
                    <li>{{ .Int "final_price" | toFloat | mul 0.01 | printf "$%.2f" }}</li>
                    <li{{ if ge $discount 50 }} class="color-positive"{{ end }}>{{ $discount }}% off</li>
                  </ul>
                </li>
              {{ end }}
              </ul>

          # From glanceapp/community-widgets (random-pokemon); randomnumberapi.com was down,
          # so the Pokémon follows the hour instead.
          - type: custom-api
            title: Pokémon of the hour
            cache: 1h
            template: |
              {{ $pokemonId := add (mod (add (mul (now).YearDay 24) (now).Hour) 151) 1 }}
              {{ $pokemon := newRequest (printf "https://pokeapi.co/api/v2/pokemon/%d" $pokemonId) | getResponse }}

              <style>
                .card-pokemon{text-align:center;padding:1.25rem 1rem;display:flex;flex-direction:column;align-items:center;gap:.75rem}
                .image-wrap-pokemon{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border-radius:50%;padding:1rem}
                .image-pokemon{width:100px;height:100px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
                .header-pokemon{display:flex;align-items:baseline;gap:.5rem}
                .name-pokemon{font-size:1.4rem;font-weight:700;text-transform:capitalize}
                .number-pokemon{font-size:.9rem;opacity:.5}
                .types-pokemon{display:flex;gap:.5rem}
                .type-pokemon{padding:.25rem .75rem;border-radius:2rem;font-size:.7rem;text-transform:uppercase;font-weight:700;letter-spacing:.05em;box-shadow:0 2px 4px rgba(0,0,0,.2)}
                .divider-pokemon{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
                .stats-pokemon{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem 1rem;width:100%}
                .stat-pokemon{display:flex;flex-direction:column;align-items:center;gap:.2rem}
                .stat-label-pokemon{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;opacity:.5;font-weight:600}
                .stat-value-pokemon{font-size:1.1rem;font-weight:700}
                .physical-pokemon{display:flex;gap:1.5rem;font-size:.75rem;opacity:.6}
                .physical-item-pokemon{display:flex;gap:.3rem}
                .physical-label-pokemon{font-weight:600}
                .error-pokemon{text-align:center;padding:2rem;opacity:.6}
                .type-normal{background:darkkhaki;color:#fff}
                .type-fire{background:tomato;color:#fff}
                .type-water{background:dodgerblue;color:#fff}
                .type-electric{background:gold;color:#000}
                .type-grass{background:mediumseagreen;color:#fff}
                .type-ice{background:skyblue;color:#000}
                .type-fighting{background:indianred;color:#fff}
                .type-poison{background:mediumorchid;color:#fff}
                .type-ground{background:tan;color:#000}
                .type-flying{background:mediumpurple;color:#fff}
                .type-psychic{background:hotpink;color:#fff}
                .type-bug{background:olivedrab;color:#fff}
                .type-rock{background:peru;color:#fff}
                .type-ghost{background:slateblue;color:#fff}
                .type-dragon{background:slateblue;color:#fff}
                .type-fairy{background:plum;color:#000}
              </style>

              {{ if eq $pokemon.Response.StatusCode 200 }}
              <div class="card-pokemon">
                <div class="image-wrap-pokemon">
                  <img class="image-pokemon" src="{{ $pokemon.JSON.String "sprites.other.official-artwork.front_default" }}" alt="{{ $pokemon.JSON.String "name" }}" onerror="this.src='{{ $pokemon.JSON.String "sprites.front_default" }}'"/>
                </div>
                <div class="header-pokemon">
                  <span class="name-pokemon">{{ $pokemon.JSON.String "name" }}</span>
                  <span class="number-pokemon">#{{ printf "%03d" ($pokemon.JSON.Int "id") }}</span>
                </div>
                <div class="types-pokemon">
                  {{ range $pokemon.JSON.Array "types" }}<span class="type-pokemon type-{{ .String "type.name" }}">{{ .String "type.name" }}</span>{{ end }}
                </div>
                <div class="divider-pokemon"></div>
                <div class="stats-pokemon">
                  {{ range $pokemon.JSON.Array "stats" }}{{ $s := .String "stat.name" }}<div class="stat-pokemon"><span class="stat-label-pokemon">{{ if eq $s "hp" }}HP{{ else if eq $s "attack" }}ATK{{ else if eq $s "defense" }}DEF{{ else if eq $s "special-attack" }}SP.ATK{{ else if eq $s "special-defense" }}SP.DEF{{ else if eq $s "speed" }}SPEED{{ end }}</span><span class="stat-value-pokemon">{{ .Int "base_stat" }}</span></div>{{ end }}
                </div>
                <div class="divider-pokemon"></div>
                <div class="physical-pokemon">
                  <div class="physical-item-pokemon"><span class="physical-label-pokemon">Height</span><span>{{ printf "%.1f" (div (toFloat ($pokemon.JSON.Int "height")) 10.0) }}m</span></div>
                  <div class="physical-item-pokemon"><span class="physical-label-pokemon">Weight</span><span>{{ printf "%.1f" (div (toFloat ($pokemon.JSON.Int "weight")) 10.0) }}kg</span></div>
                </div>
              </div>
              {{ else }}
              <div class="error-pokemon"><p>Failed to catch Pokémon!</p><p style="font-size:.8rem">{{ $pokemon.Response.Status }}</p></div>
              {{ end }}

  - name: Markets
    columns:
