    - Bazarr:
        icon: bazarr.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:6767
        description: Subtitles
        server: my-docker
        container: bazarr
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: {{HOMEPAGE_VAR_BAZARR_API_KEY}}

- Infrastructure:
    # qBittorrent shares gluetun's network namespace, so it is reachable
    # at the gluetun container name, not its own.
    - qBittorrent:
        icon: qbittorrent.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:{{HOMEPAGE_VAR_QBIT_PORT}}
        description: Downloads - inside the VPN
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://gluetun:{{HOMEPAGE_VAR_QBIT_PORT}}
          username: ""
          password: ""
          enableLeechProgress: true

    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:3003/status/stack
        description: Uptime of every service; alerts go to ntfy
        server: my-docker
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: stack

    - SABnzbd:
        icon: sabnzbd.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:8085
        description: Usenet downloads (preferred over torrents)
        server: my-docker
        container: sabnzbd
        widget:
          type: sabnzbd
          url: http://sabnzbd:8080
          key: {{HOMEPAGE_VAR_SABNZBD_API_KEY}}

    - Dozzle:
        icon: dozzle.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:8888
        description: Live logs of every container (read-only)
        server: my-docker
        container: dozzle

    - Glance:
        icon: glance.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:3005
        description: Start page - feeds, videos, markets, media calendar
        server: my-docker
        container: glance

    - Scrutiny:
        icon: scrutiny.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:3006
        description: SMART history of the media drive
        server: my-docker
        container: scrutiny

    - ChangeDetection:
        icon: changedetection.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:3007
        description: Alerts when watched web pages change
        server: my-docker
        container: changedetection

    - Grafana:
        icon: grafana.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:3001
        description: Metrics and graphs
        server: my-docker
        container: grafana

    - Jellystat:
        icon: jellyfin.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:3002
        description: Watch statistics
        server: my-docker
        container: jellystat
