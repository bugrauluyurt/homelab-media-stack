        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: {{HOMEPAGE_VAR_SONARR_API_KEY}}
          enableQueue: true

    - Questarr:
        icon: https://raw.githubusercontent.com/Doezer/Questarr/main/images/Questarr_Logo-nobg.png
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:5000
        description: Games
        server: my-docker
        container: questarr

    - Game downloads:
        icon: mdi-download-box
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:8090
        description: Download finished games to a PC (read-only)
        server: my-docker
