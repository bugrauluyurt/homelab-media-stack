- Watch:
    - Jellyfin:
        icon: jellyfin.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:8096
        description: Main media server
        server: my-docker
        container: jellyfin
        # No widget: Jellyfin 12 accepts only `Authorization: MediaBrowser
        # Token=...` and rejects X-Emby-Token, which is what Homepage's
        # jellyfin widget sends. Verified against 12.1.0 - every legacy
        # header returns 401. Watch stats come from Jellystat instead.

    - Seerr:
        icon: jellyseerr.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:5055
        description: Request a movie or show
        server: my-docker
        container: seerr
        widget:
          type: jellyseerr
          url: http://seerr:5055
          key: {{HOMEPAGE_VAR_SEERR_API_KEY}}

    - Plex:
        icon: plex.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:32400/web
        description: Unclaimed - optional
        server: my-docker
        container: plex

    - JellyDash:
        icon: jellyfin.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:3004
        description: Now playing, watch history and stats
        server: my-docker
        container: jellydash

    - Needle:
        icon: navidrome.svg
        href: "{{HOMEPAGE_VAR_NEEDLE_URL}}"
        description: Music player on Navidrome
        server: my-docker
        container: needle

- Manage:
    - Lidarr:
        icon: lidarr.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:8686
        description: Music
        server: my-docker
        container: lidarr
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: {{HOMEPAGE_VAR_LIDARR_API_KEY}}

    - Radarr:
        icon: radarr.svg
        href: http://{{HOMEPAGE_VAR_HOST_NAME}}:7878
