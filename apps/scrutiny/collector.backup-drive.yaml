# Scrutiny's collector with the backup drive too: compose.backup-drive.yml mounts it in place of collector.yaml.
# Read by: scrutiny, mounted read-only.
# Applies: when scrutiny restarts.
version: 1
devices:
  - device: /dev/sda
    type: sat
  - device: /dev/sdb
    type: sat
    # The backup drive sleeps between mirrors: skip it asleep rather than wake it (storage-mirror reads it nightly).
    commands:
      metrics_info_args: '--info --json -n standby'
      metrics_smart_args: '--xall --json -n standby'
