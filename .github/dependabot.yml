version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Only Needle: the other images follow :latest through scripts/update, and a pinned major
  # such as postgres:16 must not move without a data migration.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: ghcr.io/bugrauluyurt/needle

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
