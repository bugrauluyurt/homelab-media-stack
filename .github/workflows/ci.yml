name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  # release-pr.yml starts it for the release PR, which its token can't trigger by opening.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/check
