## apcupsd for a USB-connected APC UPS. Installed by scripts/host-install as /etc/apcupsd/apcupsd.conf;
## applies after 'sudo systemctl restart apcupsd'. docs/flows/power.md has the whole outage sequence.
UPSNAME ups
UPSCABLE usb
UPSTYPE usb
# Empty: find the UPS on USB by itself. A serial path here leaves apcupsd in COMMLOST.
DEVICE
LOCKFILE /var/lock
SCRIPTDIR /etc/apcupsd
# Debian's shutdown hook reads this to find the powerfail flag, then tells the UPS to cut and restore power.
PWRFAILDIR /etc/apcupsd
NOLOGINDIR /etc

# Shut down at whichever comes first: 5 minutes of runtime left or 10% charge.
ONBATTERYDELAY 6
BATTERYLEVEL 10
MINUTES 5
TIMEOUT 0
ANNOY 0
ANNOYDELAY 60
NOLOGON disable
KILLDELAY 0

# Readings for apcaccess, ups-metrics and stack-health, on this machine only.
NETSERVER on
NISIP 127.0.0.1
NISPORT 3551
EVENTSFILE /var/log/apcupsd.events
EVENTSFILEMAX 1024

UPSCLASS standalone
UPSMODE disable
STATTIME 0
STATFILE /var/log/apcupsd.status
LOGSTATS off
DATATIME 0
